{% extends "base.html" %}

{% block title %}
Registro de Clientes
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7 col-md-9">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h4 class="mb-0">
                    Registro de Clientes
                </h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Nombre
                        </label>

                        <input
                            type="text"
                            name="nombre"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            NIT
                        </label>

                        <input
                            type="text"
                            name="nit"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            name="correo"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Teléfono
                        </label>

                        <input
                            type="text"
                            name="telefono"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Dirección
                        </label>

                        <textarea
                            name="direccion"
                            class="form-control"
                            rows="3"
                            required
                        ></textarea>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Registrar cliente
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
